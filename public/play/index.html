<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1a12" />
  <title>🌾 풍년런</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>
  <button id="gearbtn" class="gearbtn" data-act="settings" style="display:none" aria-label="설정">⚙️</button>
  <div id="toast"></div>
  <div id="sheet-root"></div>

  <!-- 구 주소(mokabot-8ed4d.web.app/slot/) 에서 넘어온 진행도 1회 흡수.
       type="module" 은 지연 실행이므로, 일반 script 인 이 블록이 game.js 보다 먼저 끝난다.
       실패해도 조용히 무시 — 게임은 새 프로필로 정상 시작한다. -->
  <script>
    // 2026-11-23 풍년런이 모카월드 안(mokaworld.app/pungnyeon/play/)으로 옮겨 갔다.
    // 옛 주소(jackpotrun-web.web.app)로 오면 이 브라우저의 진행도(slotweb_*)를 #jrmig 로 실어 새 주소로 넘긴다.
    // ?stay=1 이면 옛 판 그대로(개발 · 확인용).
    (function () {
      var NEW_URL = "https://mokaworld.app/pungnyeon/play/";
      try {
        if (location.hostname !== "jackpotrun-web.web.app") return;
        if (/[?&]stay=1(&|$)/.test(location.search)) return;
        var payload = "";
        try {
          var bag = {}, n = 0;
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (!/^slotweb_[a-z]+$/.test(k)) continue;
            var v = localStorage.getItem(k);
            if (typeof v === "string") { bag[k] = v; n++; }
          }
          if (n > 0) {
            payload = btoa(unescape(encodeURIComponent(JSON.stringify(bag))))
              .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            // 주소가 너무 길어지면 진행도는 싣지 않는다.
            if (payload.length > 1500000) payload = "";
          }
        } catch (e) { payload = ""; }
        location.replace(NEW_URL + (payload ? "#jrmig=" + payload : ""));
        return;
      } catch (e) {
        location.replace(NEW_URL);
        return;
      }
    })();
    (function () {
      try {
        var m =(location.hash || "").match(/[#&]jrmig=([^&]+)/);
        if (!m) return;
        // 주소창 정리 — 새로고침 시 재적용되지 않도록 fragment 를 먼저 제거한다.
        history.replaceState(null, "", location.pathname + location.search);
        // 이미 이 도메인에서 플레이 중이면 덮어쓰지 않는다(기존 진행도 보호).
        if (localStorage.getItem("slotweb_profile")) return;
        var b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        var bag = JSON.parse(decodeURIComponent(escape(atob(b64))));
        Object.keys(bag).forEach(function (k) {
          if (/^slotweb_[a-z]+$/.test(k) && typeof bag[k] === "string") localStorage.setItem(k, bag[k]);
        });
      } catch (e) { /* 이전 실패 = 새 프로필로 시작 */ }
    })();
  </script>

  <script type="module" src="ui.js"></script>
</body>
</html>
